<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Selected work">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141416"/>
      <stop offset="1" stop-color="#0c0c0e"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#a07c1f"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="220" fill="#0c0c0e"/>
  <text x="40" y="36" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="4" fill="#d4af37">SELECTED WORK</text>

  <!-- card 1 -->
  <rect x="40" y="56" width="260" height="140" rx="14" fill="url(#card)" stroke="url(#border)" stroke-width="1.2"/>
  <circle cx="68" cy="86" r="5" fill="#d4af37" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="84" y="91" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#f5f5f0">PatientZero</text>
  <text x="56" y="122" font-family="system-ui,sans-serif" font-size="12" fill="#a3a3a3">
    <tspan x="56" dy="0">Graph blast-radius agent</tspan>
    <tspan x="56" dy="18">for supply-chain compromise</tspan>
    <tspan x="56" dy="18">FalkorDB · Cypher · on-call</tspan>
  </text>

  <!-- card 2 -->
  <rect x="320" y="56" width="260" height="140" rx="14" fill="url(#card)" stroke="#2a2a2e" stroke-width="1"/>
  <circle cx="348" cy="86" r="5" fill="#a07c1f" filter="url(#glow)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <text x="364" y="91" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#f5f5f0">CommonGround</text>
  <text x="336" y="122" font-family="system-ui,sans-serif" font-size="12" fill="#a3a3a3">
    <tspan x="336" dy="0">Privacy-first venue agent</tspan>
    <tspan x="336" dy="18">Workers · D1 · planning</tspan>
    <tspan x="336" dy="18">taste signals stay private</tspan>
  </text>

  <!-- card 3 -->
  <rect x="600" y="56" width="260" height="140" rx="14" fill="url(#card)" stroke="#2a2a2e" stroke-width="1"/>
  <circle cx="628" cy="86" r="5" fill="#d4af37" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="644" y="91" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#f5f5f0">MindMath</text>
  <text x="616" y="122" font-family="system-ui,sans-serif" font-size="12" fill="#a3a3a3">
    <tspan x="616" dy="0">LangGraph simulation for</tspan>
    <tspan x="616" dy="18">learning-disability math</tspan>
    <tspan x="616" dy="18">educators · live on Vercel</tspan>
  </text>

  <!-- card 4 -->
  <rect x="880" y="56" width="280" height="140" rx="14" fill="url(#card)" stroke="#2a2a2e" stroke-width="1"/>
  <circle cx="908" cy="86" r="5" fill="#e8d48b" filter="url(#glow)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="924" y="91" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#f5f5f0">Passage</text>
  <text x="896" y="122" font-family="system-ui,sans-serif" font-size="12" fill="#a3a3a3">
    <tspan x="896" dy="0">Digital estate + dead-man</tspan>
    <tspan x="896" dy="18">switch on-chain</tspan>
    <tspan x="896" dy="18">TS · Python · Solidity</tspan>
  </text>
</svg>
